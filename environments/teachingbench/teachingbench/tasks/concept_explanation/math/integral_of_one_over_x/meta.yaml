  We just learned ∫ x^n dx = x^(n+1)/(n+1) + C. But what about ∫ 1/x dx, which is ∫ x^(-1) dx? The formula would give x^0 / 0 which is undefined. Then my prof just wrote down "= ln|x| + C" with no explanation. Where does ln come from? And why does the formula break here specifically?

