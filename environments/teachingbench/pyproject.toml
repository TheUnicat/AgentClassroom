[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "teachingbench"
version = "0.1.0"
description = "RL environment for evaluating how well an LLM teaches a concept. Multi-turn dialog (1..N turns per task) between a tutor model and a simulated student, scored by an LLM judge against a structured per-criterion rubric. Supports tool calls (incl. stub image-gen) and per-task system prompt + rubric overrides."
requires-python = ">=3.11"
tags = [
    "teaching",
    "education",
    "tutoring",
    "tool-use",
    "multi-turn",
    "agent",
    "eval",
    "train",
]
dependencies = [
    "verifiers>=0.1.14",
    "openai>=1.55",
    "datasets>=2.20",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
materials = [
    "markitdown>=0.1.0",
    "python-frontmatter>=1.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["teachingbench"]
exclude = [
    "teachingbench/runs",
    "teachingbench/runs/**",
    "teachingbench/outputs",
    "teachingbench/outputs/**",
    "teachingbench/.cache",
    "teachingbench/.cache/**",
    "**/__pycache__",
    "**/*.pyc",
]

[tool.hatch.metadata]
allow-direct-references = true
