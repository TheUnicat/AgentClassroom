[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gradingbench"
version = "0.1.0"
description = "RL environment for evaluating how well an LLM grades student work against a rubric. Single-turn: LLM sees one piece of student work + rubric, emits a 1-4 grade + rationale, scored by agreement with a ground-truth human-teacher grade. Sibling of teachingbench."
requires-python = ">=3.11"
tags = [
    "grading",
    "education",
    "rubric",
    "single-turn",
    "agent",
    "eval",
    "train",
]
dependencies = [
    "verifiers>=0.1.14",
    "openai>=1.55",
    "anthropic>=0.39",
    "datasets>=2.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["gradingbench"]
exclude = [
    "gradingbench/runs",
    "gradingbench/runs/**",
    "gradingbench/outputs",
    "gradingbench/outputs/**",
    "gradingbench/.cache",
    "gradingbench/.cache/**",
    "**/__pycache__",
    "**/*.pyc",
]

[tool.hatch.metadata]
allow-direct-references = true
